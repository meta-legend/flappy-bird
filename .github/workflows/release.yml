name: Build & Release

# Builds self-contained binaries for Windows, Linux and macOS.
# - Push a version tag (e.g. v1.0.0) to build AND publish a GitHub Release.
# - Or run manually (workflow_dispatch) to just build + upload artifacts.
on:
  push:
    branches: ['**']   # build on every branch push (validation)
    tags: ['v*']       # tags additionally publish a Release (see release job)
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triplet: x64-windows-static   # static CRT + deps -> single portable .exe
            # Match our target's CRT to vcpkg's static-CRT deps (avoids LNK2038).
            cmake_args: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          - os: ubuntu-latest
            triplet: x64-linux            # static libs by default on Linux
            cmake_args: ""
          - os: macos-latest
            triplet: arm64-osx            # Apple Silicon runners
            cmake_args: ""
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # raylib (built from source by vcpkg) needs X11/GL dev headers on Linux.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxext-dev \
            autoconf automake libtool pkg-config

      - name: Prepare vcpkg binary cache
        shell: bash
        run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

      - name: Cache vcpkg build artifacts
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.triplet }}-

      # Full vcpkg clone (not shallow): version overrides resolve port versions
      # by git-tree, which requires the full history. This mirrors a developer's
      # local vcpkg clone, so the manifest resolves identically everywhere.
      - name: Set up vcpkg
        shell: bash
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git vcpkg-ci
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./vcpkg-ci/bootstrap-vcpkg.bat -disableMetrics
          else
            ./vcpkg-ci/bootstrap-vcpkg.sh -disableMetrics
          fi
          echo "VCPKG_ROOT=$(pwd)/vcpkg-ci" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DLEADERBOARD_SECRET="${{ secrets.LEADERBOARD_SECRET }}" \
            ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Package (CPack -> zip/tar.gz)
        run: cmake --build build --config Release --target package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlappyBird-${{ runner.os }}
          # only the final CPack archive, NOT the _CPack_Packages/ staging tree that also lives under build/package/.
          # uploading the staging tree made the release step try to publish every loose resource file as its own asset
          # (with same-named collisions across platforms, e.g. data.pak / theme.mp3 / *.png), which failed the release.
          path: |
            build/package/*.zip
            build/package/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # publish only the per-platform archives (belt-and-suspenders with the narrowed upload path above)
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
          generate_release_notes: true

  itch:
    name: Push to itch.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      ITCH_TARGET: meta-legend/flappy-bird
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install butler
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -o butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"

      - name: Butler status
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler -V

      - name: Push builds to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # github.ref_name is the tag (e.g. v1.0.0); strip the leading 'v' for --userversion.
          USERVERSION="${VERSION#v}"
          # channel -> filename glob
          declare -A channels=(
            [windows]="artifacts/**/flappybird++v*-windows.zip"
            [linux]="artifacts/**/flappybird++v*-linux.tar.gz"
            [mac]="artifacts/**/flappybird++v*-macos.tar.gz"
          )
          shopt -s globstar nullglob
          for channel in "${!channels[@]}"; do
            files=( ${channels[$channel]} )
            if [ ${#files[@]} -eq 0 ]; then
              echo "No artifact for channel '$channel' (pattern: ${channels[$channel]})" >&2
              exit 1
            fi
            echo "Pushing ${files[0]} -> ${ITCH_TARGET}:${channel} (version ${USERVERSION})"
            butler push "${files[0]}" "${ITCH_TARGET}:${channel}" --userversion "${USERVERSION}"
          done
